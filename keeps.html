<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keeps</title>
    <style>
      :root {
        --bg: #f7f4ed;
        --bg2: #eee7da;
        --accent: #657153;
        --accent2: #8b6b4c;
        --border: #d8cfbe;
        --text: #2f2f2f;
        --text2: #6d6a65;
        --danger: #a05a4c;
        --warn: #b98b3e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Georgia, "Iowan Old Style", serif;
        -webkit-font-smoothing: antialiased;
      }
      #app {
        max-width: 640px;
        margin: 0 auto;
        min-height: 100vh;
        background: var(--bg);
        position: relative;
        padding-bottom: 100px;
      }
      .header {
        padding: 24px 20px 12px;
        position: sticky;
        top: 0;
        background: var(--bg);
        z-index: 5;
        border-bottom: 1px solid var(--border);
      }
      .header h1 {
        margin: 0 0 12px;
        font-size: 28px;
        letter-spacing: 0.5px;
        font-weight: 600;
      }
      .back {
        cursor: pointer;
        color: var(--accent2);
        font-size: 14px;
        margin-bottom: 10px;
        display: inline-block;
      }
      .search-bar input,
      .form-group input,
      .form-group select,
      .form-group textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--bg2);
        color: var(--text);
        font-family: inherit;
        font-size: 15px;
      }
      .form-group textarea {
        min-height: 90px;
        resize: vertical;
      }
      .form-group {
        margin-bottom: 14px;
      }
      .form-group label {
        display: block;
        font-size: 13px;
        color: var(--text2);
        margin-bottom: 6px;
      }
      .product-list {
        padding: 12px 16px;
      }
      .product-card {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 16px;
        margin-bottom: 12px;
        cursor: pointer;
        transition: transform 0.2s ease;
      }
      .product-card:hover {
        transform: translateY(-2px);
      }
      .product-card .name {
        font-size: 18px;
        font-weight: 600;
        margin: 0 0 4px;
      }
      .product-card .meta {
        font-size: 13px;
        color: var(--text2);
      }
      .badge {
        display: inline-block;
        padding: 3px 9px;
        border-radius: 20px;
        font-size: 11px;
        margin-left: 6px;
        background: var(--accent);
        color: #fff;
      }
      .badge.warn {
        background: var(--warn);
      }
      .badge.danger {
        background: var(--danger);
      }
      .badge.muted {
        background: var(--text2);
      }
      .fab {
        position: fixed;
        bottom: 28px;
        right: calc(50% - 320px + 24px);
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        border: none;
        font-size: 28px;
        cursor: pointer;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      @media (max-width: 680px) {
        .fab {
          right: 24px;
        }
      }
      .btn {
        padding: 10px 18px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--bg2);
        color: var(--text);
        cursor: pointer;
        font-family: inherit;
        font-size: 14px;
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
        border: none;
      }
      .btn-danger {
        background: transparent;
        color: var(--danger);
        border: 1px solid var(--danger);
      }
      .btn-row {
        display: flex;
        gap: 10px;
        margin-top: 16px;
        flex-wrap: wrap;
      }
      .hero {
        padding: 20px;
        background: var(--bg2);
        border-radius: 0 0 24px 24px;
        border-bottom: 1px solid var(--border);
      }
      .hero h2 {
        margin: 0 0 4px;
        font-size: 26px;
      }
      .hero .sub {
        color: var(--text2);
        font-size: 14px;
      }
      .hero-stats {
        display: flex;
        gap: 18px;
        margin-top: 14px;
        flex-wrap: wrap;
      }
      .hero-stats .stat {
        font-size: 13px;
        color: var(--text2);
      }
      .hero-stats .stat b {
        display: block;
        color: var(--text);
        font-size: 16px;
        font-weight: 600;
      }
      .timeline {
        padding: 20px;
        position: relative;
      }
      .timeline::before {
        content: "";
        position: absolute;
        left: 36px;
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--border);
      }
      .event {
        position: relative;
        padding-left: 56px;
        margin-bottom: 18px;
      }
      .event .dot {
        position: absolute;
        left: 26px;
        top: 4px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--bg);
        border: 2px solid var(--accent2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
      }
      .event .card {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px 14px;
        cursor: pointer;
      }
      .event .card .date {
        font-size: 12px;
        color: var(--text2);
      }
      .event .card .type {
        font-weight: 600;
        font-size: 15px;
        margin: 2px 0;
      }
      .event .card .preview {
        font-size: 13px;
        color: var(--text2);
      }
      .event .details {
        margin-top: 8px;
        padding: 12px 14px;
        background: var(--bg);
        border: 1px dashed var(--border);
        border-radius: 12px;
        font-size: 14px;
        line-height: 1.5;
      }
      .section-title {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text2);
        margin: 22px 20px 8px;
      }
      .empty {
        text-align: center;
        color: var(--text2);
        padding: 60px 20px;
        font-size: 15px;
      }
      .view-body {
        padding: 8px 20px 40px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      /* ---------- Data layer ---------- */
      const DB_KEY = "keeps_data_v1";
      function loadDB() {
        const raw = localStorage.getItem(DB_KEY);
        return raw ? JSON.parse(raw) : { products: {}, events: {} };
      }
      function saveDB(d) {
        localStorage.setItem(DB_KEY, JSON.stringify(d));
      }
      let db = loadDB();

      function uid() {
        return (
          Math.random().toString(36).slice(2, 10) + Date.now().toString(36)
        );
      }
      function esc(s) {
        return (s || "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
      function nl2br(s) {
        return esc(s).replace(/\n/g, "<br>");
      }
      function fmtDate(iso) {
        if (!iso) return "—";
        return new Date(iso).toLocaleDateString(undefined, {
          year: "numeric",
          month: "short",
          day: "numeric",
        });
      }
      function daysBetween(a, b) {
        return Math.round((new Date(b) - new Date(a)) / 86400000);
      }
      function fmtMoney(n) {
        if (n === null || n === undefined || isNaN(n)) return "—";
        return (
          "$" +
          Number(n).toLocaleString(undefined, { maximumFractionDigits: 2 })
        );
      }

      /* ---------- State ---------- */
      let state = { view: "home", productId: null, search: "" };
      function go(view, productId) {
        state.view = view;
        state.productId = productId || null;
        render();
        window.scrollTo(0, 0);
      }

      /* ---------- Derived stats ---------- */
      function productEvents(pid) {
        return Object.values(db.events)
          .filter((e) => e.productId === pid)
          .sort((a, b) => new Date(a.date) - new Date(b.date));
      }
      function computeStats(p) {
        const evs = productEvents(p.id);
        const now = new Date();
        const purchase = new Date(p.purchaseDate);
        const endEvent = evs.find(
          (e) => e.type === "Reflection" && p.status !== "Active",
        );
        const endDate =
          p.status !== "Active" && endEvent ? new Date(endEvent.date) : now;
        const ownershipDays = Math.max(0, daysBetween(purchase, endDate));
        const eventCost = evs.reduce(
          (sum, e) => sum + (Number(e.cost) || 0),
          0,
        );
        const totalCost = (Number(p.purchasePrice) || 0) + eventCost;
        const costPerDay =
          ownershipDays > 0 ? totalCost / ownershipDays : totalCost;
        const repairs = evs.filter((e) => e.type === "Repair").length;
        const maintenance = evs.filter((e) => e.type === "Maintenance").length;
        let warrantyDays = null;
        if (p.warrantyExpiry && p.status === "Active") {
          warrantyDays = daysBetween(now, p.warrantyExpiry);
        }
        return {
          ownershipDays,
          totalCost,
          costPerDay,
          repairs,
          maintenance,
          warrantyDays,
        };
      }
      function warrantyBadge(p) {
        const s = computeStats(p);
        if (s.warrantyDays === null) return "";
        if (s.warrantyDays < 0)
          return '<span class="badge muted">Warranty expired</span>';
        if (s.warrantyDays <= 7)
          return `<span class="badge danger">Warranty: ${s.warrantyDays}d left</span>`;
        if (s.warrantyDays <= 30)
          return `<span class="badge warn">Warranty: ${s.warrantyDays}d left</span>`;
        return `<span class="badge">Warranty active</span>`;
      }
      const EVENT_ICONS = {
        Observation: "👁",
        Repair: "🔧",
        Maintenance: "🧴",
        "Warranty Claim": "📄",
        Upgrade: "⬆",
        "Accessory Added": "➕",
        "Configuration Change": "⚙",
        Cleaning: "✨",
        Damage: "⚠",
        Reminder: "⏰",
        Reflection: "💭",
        Other: "•",
        Purchase: "🛒",
      };

      /* ---------- Render ---------- */
      function render() {
        const app = document.getElementById("app");
        if (state.view === "home") app.innerHTML = renderHome();
        else if (state.view === "newProduct")
          app.innerHTML = renderNewProduct();
        else if (state.view === "detail")
          app.innerHTML = renderDetail(state.productId);
        else if (state.view === "newEvent")
          app.innerHTML = renderNewEvent(state.productId);
        else if (state.view === "endOfLife")
          app.innerHTML = renderEndOfLife(state.productId);
      }

      function renderHome() {
        let products = Object.values(db.products).sort(
          (a, b) => new Date(b.updatedAt) - new Date(a.updatedAt),
        );
        if (state.search) {
          const q = state.search.toLowerCase();
          products = products.filter((p) =>
            [p.name, p.brand, p.category, p.status]
              .join(" ")
              .toLowerCase()
              .includes(q),
          );
        }
        const cards =
          products
            .map((p) => {
              const years = (
                daysBetween(p.purchaseDate, new Date()) / 365
              ).toFixed(1);
              return `<div class="product-card" onclick="go('detail','${p.id}')">
      <div class="name">${esc(p.name)} ${warrantyBadge(p)}</div>
      <div class="meta">${esc(p.brand || "")} ${p.brand ? "·" : ""} ${esc(p.category || "")} · ${years}y old · <span class="badge muted">${p.status}</span></div>
    </div>`;
            })
            .join("") ||
          `<div class="empty">No products yet.<br>Tap + to add your first one.</div>`;

        return `
  <div class="header"><h1>Keeps</h1>
    <div class="search-bar"><input placeholder="Search products…" value="${esc(state.search)}" oninput="state.search=this.value; render();" /></div>
  </div>
  <div class="product-list">${cards}</div>
  <button class="fab" onclick="go('newProduct')">+</button>
  `;
      }

      function renderNewProduct() {
        return `
  <div class="header"><span class="back" onclick="go('home')">← Back</span><h1>New Product</h1></div>
  <div class="view-body">
    <form onsubmit="return submitNewProduct(event)">
      <div class="form-group"><label>Name *</label><input id="f_name" required /></div>
      <div class="form-group"><label>Category</label><input id="f_category" placeholder="e.g. Electronics, Furniture" /></div>
      <div class="form-group"><label>Brand</label><input id="f_brand" /></div>
      <div class="form-group"><label>Purchase Price</label><input id="f_price" type="number" step="0.01" /></div>
      <div class="form-group"><label>Purchase Date *</label><input id="f_date" type="date" required value="${new Date().toISOString().slice(0, 10)}" /></div>
      <div class="form-group"><label>Warranty Expiry</label><input id="f_warranty" type="date" /></div>
      <div class="form-group"><label>Purchase Journal — why did you buy it, alternatives considered, concerns, expectations</label><textarea id="f_journal" placeholder="Write freely…"></textarea></div>
      <div class="btn-row">
        <button type="submit" class="btn btn-primary">Save Product</button>
        <button type="button" class="btn" onclick="go('home')">Cancel</button>
      </div>
    </form>
  </div>`;
      }

      function submitNewProduct(e) {
        e.preventDefault();
        const id = uid();
        const now = new Date().toISOString();
        db.products[id] = {
          id,
          name: document.getElementById("f_name").value.trim(),
          category: document.getElementById("f_category").value.trim(),
          brand: document.getElementById("f_brand").value.trim(),
          purchasePrice:
            parseFloat(document.getElementById("f_price").value) || 0,
          purchaseDate: document.getElementById("f_date").value,
          warrantyExpiry: document.getElementById("f_warranty").value || null,
          status: "Active",
          journal: document.getElementById("f_journal").value.trim(),
          createdAt: now,
          updatedAt: now,
        };
        saveDB(db);
        go("detail", id);
        return false;
      }

      function renderDetail(pid) {
        const p = db.products[pid];
        if (!p) return renderHome();
        const s = computeStats(p);
        const evs = productEvents(pid);
        const timelineItems = [
          {
            id: "purchase",
            date: p.purchaseDate,
            type: "Purchase",
            cost: p.purchasePrice,
            note: p.journal,
            synthetic: true,
          },
        ].concat(evs);

        const timelineHtml = timelineItems
          .map((e) => {
            const icon = EVENT_ICONS[e.type] || "•";
            const preview = (e.note || "").slice(0, 70).replace(/\n/g, " ");
            return `<div class="event">
      <div class="dot">${icon}</div>
      <div class="card" onclick="toggleEvent('${e.id}')">
        <div class="date">${fmtDate(e.date)}</div>
        <div class="type">${e.type}${e.cost ? ` · ${fmtMoney(e.cost)}` : ""}</div>
        <div class="preview">${esc(preview)}${preview.length === 70 ? "…" : ""}</div>
      </div>
      <div class="details" id="details_${e.id}" style="display:none;">
        ${nl2br(e.note || "(no notes)")}
        ${e.warrantyExpiry ? `<br><br><i>Warranty tied to this event until ${fmtDate(e.warrantyExpiry)}</i>` : ""}
        ${!e.synthetic ? `<div class="btn-row"><button class="btn btn-danger" onclick="deleteEvent('${e.id}')">Delete Event</button></div>` : ""}
      </div>
    </div>`;
          })
          .join("");

        return `
  <div class="header"><span class="back" onclick="go('home')">← Back</span></div>
  <div class="hero">
    <h2>${esc(p.name)}</h2>
    <div class="sub">${esc(p.brand || "")} ${p.brand && p.category ? "·" : ""} ${esc(p.category || "")} · <span class="badge muted">${p.status}</span> ${warrantyBadge(p)}</div>
    <div class="hero-stats">
      <div class="stat"><b>${(s.ownershipDays / 365).toFixed(1)}y</b>Owned</div>
      <div class="stat"><b>${fmtMoney(s.totalCost)}</b>Total cost</div>
      <div class="stat"><b>${fmtMoney(s.costPerDay)}</b>Per day</div>
      <div class="stat"><b>${s.repairs}</b>Repairs</div>
      <div class="stat"><b>${s.maintenance}</b>Maintenance</div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="go('newEvent','${p.id}')">+ Add Event</button>
      ${p.status === "Active" ? `<button class="btn" onclick="go('endOfLife','${p.id}')">Mark Complete</button>` : ""}
      <button class="btn" onclick="exportProduct('${p.id}')">Export JSON</button>
      <button class="btn btn-danger" onclick="deleteProduct('${p.id}')">Delete Product</button>
    </div>
  </div>
  <div class="section-title">Timeline</div>
  <div class="timeline">${timelineHtml}</div>`;
      }

      function toggleEvent(id) {
        const el = document.getElementById("details_" + id);
        if (el)
          el.style.display = el.style.display === "none" ? "block" : "none";
      }

      function renderNewEvent(pid) {
        const types = Object.keys(EVENT_ICONS).filter((t) => t !== "Purchase");
        return `
  <div class="header"><span class="back" onclick="go('detail','${pid}')">← Back</span><h1>Add Event</h1></div>
  <div class="view-body">
    <form onsubmit="return submitNewEvent(event,'${pid}')">
      <div class="form-group"><label>Type</label><select id="e_type">${types.map((t) => `<option>${t}</option>`).join("")}</select></div>
      <div class="form-group"><label>Date</label><input id="e_date" type="date" required value="${new Date().toISOString().slice(0, 10)}" /></div>
      <div class="form-group"><label>Cost (optional)</label><input id="e_cost" type="number" step="0.01" /></div>
      <div class="form-group"><label>Warranty Expiry (optional)</label><input id="e_warranty" type="date" /></div>
      <div class="form-group"><label>Notes</label><textarea id="e_note" placeholder="What happened?"></textarea></div>
      <div class="btn-row">
        <button type="submit" class="btn btn-primary">Save Event</button>
        <button type="button" class="btn" onclick="go('detail','${pid}')">Cancel</button>
      </div>
    </form>
  </div>`;
      }

      function submitNewEvent(e, pid) {
        e.preventDefault();
        const id = uid();
        const now = new Date().toISOString();
        db.events[id] = {
          id,
          productId: pid,
          type: document.getElementById("e_type").value,
          date: document.getElementById("e_date").value,
          cost: parseFloat(document.getElementById("e_cost").value) || null,
          warrantyExpiry: document.getElementById("e_warranty").value || null,
          note: document.getElementById("e_note").value.trim(),
          createdAt: now,
        };
        db.products[pid].updatedAt = now;
        saveDB(db);
        go("detail", pid);
        return false;
      }

      function deleteEvent(id) {
        if (!confirm("Delete this event?")) return;
        const pid = db.events[id].productId;
        delete db.events[id];
        saveDB(db);
        go("detail", pid);
      }
      function deleteProduct(pid) {
        if (
          !confirm(
            "Delete this product and all its events? This cannot be undone.",
          )
        )
          return;
        Object.values(db.events)
          .filter((e) => e.productId === pid)
          .forEach((e) => delete db.events[e.id]);
        delete db.products[pid];
        saveDB(db);
        go("home");
      }

      function renderEndOfLife(pid) {
        return `
  <div class="header"><span class="back" onclick="go('detail','${pid}')">← Back</span><h1>Mark Complete</h1></div>
  <div class="view-body">
    <form onsubmit="return submitEndOfLife(event,'${pid}')">
      <div class="form-group"><label>What happened?</label>
        <select id="eol_status"><option>Sold</option><option>Disposed</option><option>Given Away</option><option>Lost</option><option>Stolen</option><option>Other</option></select>
      </div>
      <div class="form-group"><label>Would you buy it again?</label><textarea id="eol_q1"></textarea></div>
      <div class="form-group"><label>What surprised you?</label><textarea id="eol_q2"></textarea></div>
      <div class="form-group"><label>Biggest strength?</label><textarea id="eol_q3"></textarea></div>
      <div class="form-group"><label>Biggest weakness?</label><textarea id="eol_q4"></textarea></div>
      <div class="form-group"><label>Final thoughts</label><textarea id="eol_q5"></textarea></div>
      <div class="btn-row">
        <button type="submit" class="btn btn-primary">Save & Close Out</button>
        <button type="button" class="btn" onclick="go('detail','${pid}')">Cancel</button>
      </div>
    </form>
  </div>`;
      }

      function submitEndOfLife(e, pid) {
        e.preventDefault();
        const now = new Date().toISOString();
        const status = document.getElementById("eol_status").value;
        const note = `Would buy again: ${document.getElementById("eol_q1").value}\n\nWhat surprised me: ${document.getElementById("eol_q2").value}\n\nBiggest strength: ${document.getElementById("eol_q3").value}\n\nBiggest weakness: ${document.getElementById("eol_q4").value}\n\nFinal thoughts: ${document.getElementById("eol_q5").value}`;
        const id = uid();
        db.events[id] = {
          id,
          productId: pid,
          type: "Reflection",
          date: now.slice(0, 10),
          cost: null,
          warrantyExpiry: null,
          note,
          createdAt: now,
        };
        db.products[pid].status = status;
        db.products[pid].updatedAt = now;
        saveDB(db);
        go("detail", pid);
        return false;
      }

      function exportProduct(pid) {
        const p = db.products[pid];
        const evs = productEvents(pid);
        const blob = new Blob(
          [JSON.stringify({ product: p, events: evs }, null, 2)],
          { type: "application/json" },
        );
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `${p.name.replace(/\s+/g, "_")}.json`;
        a.click();
        URL.revokeObjectURL(url);
      }

      render();
    </script>
  </body>
</html>
