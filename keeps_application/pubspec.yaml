name: keeps
description: A personal Product Lifecycle Management journal.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2       # was ^2.6.1
  riverpod_annotation: ^4.0.3    # was ^2.6.1
  drift: ^2.32.1
  drift_flutter: ^0.3.0
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  google_fonts: ^6.3.3
  flutter_markdown: ^0.7.7
  pdf: ^3.13.0
  printing: ^5.13.1
  intl: ^0.19.0
  uuid: ^4.5.3
  share_plus: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  drift_dev: ^2.32.1
  riverpod_generator: ^4.0.4     # was ^2.4.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true