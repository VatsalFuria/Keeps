name: keeps
description: A personal Product Lifecycle Management journal.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  drift: ^2.19.0
  drift_flutter: ^0.2.0
  path_provider: ^2.1.3
  path: ^1.9.0
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  google_fonts: ^6.2.1
  flutter_markdown: ^0.7.1
  pdf: ^3.11.0
  printing: ^5.13.1
  intl: ^0.19.0
  uuid: ^4.4.0
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  drift_dev: ^2.19.0
  riverpod_generator: ^2.4.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true